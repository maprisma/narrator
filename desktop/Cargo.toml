[package]
name = "maprisma-narrator-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Maprisma Narrator's desktop side on COSMIC: windows, captures, area selection, page-turn keys, passage highlight"

[dependencies]
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", rev = "c0cff4d" }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time", "process", "net", "io-util", "sync", "signal"] }
serde_json = "1"
png = "0.18"
libc = "0.2"

wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
